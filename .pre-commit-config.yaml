repos:
  - repo: local
    hooks:
      - id: check-public-repo
        name: no internal references (public repo)
        entry: scripts/check-public-repo.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: check-content
        name: frontmatter contract
        entry: scripts/check-content.py
        language: script
        pass_filenames: false
        always_run: true
