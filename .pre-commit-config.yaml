repos:
  - repo: local
    hooks:
      - id: check-public-repo
        name: no internal references (public repo)
        entry: scripts/check-public-repo.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: check-content
        name: frontmatter contract
        entry: scripts/check-content.py
        language: script
        pass_filenames: false
        always_run: true
      - id: check-links
        name: advertised URLs resolve to emitted pages
        entry: sh -c 'scripts/emit.py >/dev/null && scripts/check-links.py'
        language: system
        pass_filenames: false
        always_run: true
      - id: check-retrieval
        name: eval questions surface their concept
        entry: sh -c 'scripts/emit.py >/dev/null && scripts/check-retrieval.py'
        language: system
        pass_filenames: false
        always_run: true
      - id: check-vocabulary
        name: every page speaks the product's words
        entry: scripts/check-vocabulary.py --strict
        language: script
        pass_filenames: false
        always_run: true
