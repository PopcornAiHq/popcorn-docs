name: Sync CLI reference

# Keeps content/reference/cli.md in step with the latest popcorn CLI release.
#
# The page is generated from the CLI's own help and schema, and the CLI ships
# on its own schedule, so the page goes stale without any change here. This
# regenerates it daily and, when it differs, proposes the new page as a pull
# request on one fixed branch. It never pushes to main: the change still goes
# through review and the same required checks as any other.
#
# It is deliberately not a check in CI. A new CLI release would then fail every
# unrelated pull request until someone regenerated the page, which blames the
# wrong change and blocks work that has nothing to do with the CLI.
#
# A pull request opened with GITHUB_TOKEN does not trigger other workflows, so
# CI does not run on it by itself and the required checks never report. The
# gates CI runs are therefore run here, on the regenerated page, before
# anything is pushed. A maintainer still has to start CI on the pull request —
# closing and reopening it is enough, since that event comes from a person.
#
# The activity and MCP pages are not synced here: one reads prod through an
# authenticated CLI and the other reads a private checkout, and neither is
# available to a public repository's workflow.

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

concurrency:
  # Two runs would race to force-push the same branch. Queue rather than
  # cancel, so a manual run is never dropped for a scheduled one.
  group: sync-cli
  cancel-in-progress: false

# Nothing at the workflow level; the one job asks for what it writes.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the automation branch
      pull-requests: write   # open, edit or close its pull request
    env:
      BRANCH: automation/sync-cli
      PAGE: content/reference/cli.md
      GH_TOKEN: ${{ github.token }}
      # Agent mode keeps the CLI from ever prompting. It also implies no update
      # check; that is set explicitly too, because an auto-upgrade mid-run would
      # regenerate the page from a different release than the one installed.
      POPCORN_AGENT: '1'
      POPCORN_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The CLI installs from its GitHub repository, not PyPI. Pin the install
      # to the latest release's tag rather than the default branch: the page
      # describes what an author gets from a release, and main runs ahead.
      - name: Install the latest CLI release
        run: |
          tag=$(gh release view --repo PopcornAiHq/popcorn-cli --json tagName --jq .tagName)
          python -m pip install --quiet "git+https://github.com/PopcornAiHq/popcorn-cli@${tag}"
          popcorn version

      - name: Regenerate the page
        run: python3 scripts/sync-cli.py

      - name: Has it changed
        id: diff
        run: |
          if git diff --quiet -- "$PAGE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- "$PAGE"
          fi

      # The page is current, so any open proposal is stale — most likely the
      # page was regenerated by hand and merged. Close it rather than leave a
      # pull request that duplicates main.
      - name: Close a stale pull request
        if: steps.diff.outputs.changed == 'false'
        run: |
          state=$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)
          if [ "$state" = "OPEN" ]; then
            gh pr close "$BRANCH" --delete-branch \
              --comment "Main already matches the latest CLI release; nothing to sync."
          fi

      # The same gates CI runs, because CI will not run on the pull request by
      # itself. The leak guard reads the index, so the page is staged first.
      # The CLI's descriptions are its own help text, which can carry anything;
      # a hit here is fixed in the CLI, not on the page.
      - name: No internal references
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add -- "$PAGE"
          scripts/check-public-repo.sh

      - name: Frontmatter contract
        if: steps.diff.outputs.changed == 'true'
        run: scripts/check-content.py

      - name: Build the corpus
        if: steps.diff.outputs.changed == 'true'
        run: scripts/emit.py

      - name: Every advertised URL resolves
        if: steps.diff.outputs.changed == 'true'
        run: scripts/check-links.py

      - name: Every eval question surfaces its concept
        if: steps.diff.outputs.changed == 'true'
        run: scripts/check-retrieval.py

      # The branch is rebuilt from main on every run and force-pushed, so it
      # always holds exactly one commit: the regenerated page on current main.
      # When the branch already carries this exact page, the push is skipped,
      # so a run with no new release leaves the pull request — and any CI a
      # maintainer started on it — alone.
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        run: |
          # The version the page itself records, so the title cannot disagree
          # with the badge the page shows.
          version=$(sed -n 's/^version: //p' "$PAGE")
          title="docs: the CLI reference matches popcorn ${version}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit --quiet -m "$title" -- "$PAGE"

          if git fetch --quiet origin "$BRANCH" 2>/dev/null \
            && git diff --quiet FETCH_HEAD -- "$PAGE"; then
            echo "$BRANCH already carries this page; not pushing."
          else
            git push --force origin "$BRANCH"
          fi

          body=$(cat <<EOF
          Regenerated \`${PAGE}\` from popcorn ${version}, the latest CLI release, by \`scripts/sync-cli.py\`.

          The sync workflow already ran the leak guard and the content checks on this page. CI does not start on a pull request opened by a workflow, so **close and reopen this pull request** to run the required checks before merging.
          EOF
          )

          state=$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)
          if [ "$state" = "OPEN" ]; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          fi
