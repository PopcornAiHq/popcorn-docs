name: Publish

# Publishes the built corpus to the docs site.
#
# push-to-main only, and deliberately not pull_request. The deploy role's trust
# policy pins the OIDC subject to `ref:refs/heads/main`, so a run from any
# other ref cannot assume it — a pull_request run would fail at the credentials
# step rather than do anything useful. That pinning is the point: this
# repository is public and anyone can open a pull request against it, so only
# reviewed, merged content reaches the bucket.
#
# For the same reason, do not add an `environment:` to the publish job. A job
# that declares one gets the subject `repo:…:environment:<name>` instead, which
# the role does not trust, and the failure looks like a credentials problem
# rather than a configuration one.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/publish.yml'
  # Re-publish without a commit. Useful because some fixes never change a file:
  # a content type or a deletion leaves bodies byte-identical, so CloudFront
  # revalidates, gets a 304 and serves the old response until an invalidation.
  workflow_dispatch:

concurrency:
  # Never let two publishes interleave uploads into one bucket. Queue rather
  # than cancel: a cancelled run may have uploaded some of the corpus already.
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The same gates CI runs. They run again here rather than being trusted
      # from the pull request: this job publishes whatever is on main, which
      # after a merge is not byte-for-byte any branch that was tested.
      - name: No internal references
        run: scripts/check-public-repo.sh

      - name: Frontmatter contract
        run: scripts/check-content.py

      - name: Build the corpus
        run: scripts/emit.py

      - name: Every advertised URL resolves
        run: scripts/check-links.py

      - name: Every eval question surfaces its concept
        run: scripts/check-retrieval.py

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Bucket and distribution are secrets rather than literals or variables.
      # This repository is public and so are its build logs; a variable is not
      # masked in output, and publish.py prints the bucket it wrote to.
      - name: Publish
        env:
          DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
          DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}
        run: scripts/publish.py

      # The only check that fetches the real site. It runs after the upload
      # rather than gating it, because a failure here means the site is wrong
      # now — the build was already proven by the steps above.
      #
      # The invalidation publish.py requests is asynchronous, so give the edge
      # a moment before reading back; otherwise this reports the previous
      # publish and passes or fails for the wrong reason.
      - name: Let the invalidation land
        run: sleep 45

      - name: The published site is usable
        run: scripts/check-published.py
