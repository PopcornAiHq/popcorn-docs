name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  public-repo:
    # This repository is public. The guard scans the whole tracked tree in a CI
    # checkout, so it fails the build on a violation that predates the PR
    # rather than only on what the PR touched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No internal references
        run: scripts/check-public-repo.sh

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frontmatter contract
        run: scripts/check-content.py
      - name: Build the corpus
        run: scripts/emit.py
      - name: Every eval question surfaces its concept
        run: scripts/check-retrieval.py
