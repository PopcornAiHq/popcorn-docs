# The validation set for the concept summaries.
#
# The gate this feeds is narrow on purpose: NOT "can an agent author a bundle"
# — a harness elsewhere measures that, with a shell and unlimited turns — but
# "do these summaries answer the question an agent actually hits, for a model
# that cannot explore its way out."
#
# How to run it, in the cheapest form that is still honest:
#
#   1. Give the model ONLY `build/llms.txt` — every summary, no bodies. That is
#      the one-call budget, and handing it the bodies measures something nobody
#      will ever experience. `scripts/eval-kit.py` prints it with the preamble;
#      `scripts/eval-run.py` sends it to the Gemini API and prints a transcript
#      for another model to grade against the rules below.
#   2. Ask one question, in a session that has seen nothing else, and throw
#      the session away. Most of these share a concept with another question,
#      so asking them in sequence lets the model answer from its own earlier
#      turn rather than from the summary, and the run scores the transcript
#      instead of the corpus. No follow-ups, no hints, no naming the concept.
#   3. Score the ACTION, not the prose.
#
# Scoring, decided before running so it cannot be rationalised after:
#
#   PASS  the answer leads to `pass` below.
#   PASS  "I need more detail — read <concept>" naming the right concept. That
#         is the one-call-then-one-more shape working as designed, not a miss.
#   PASS  the same deferral naming a guide, when that guide covers the question.
#         The index carries guides as well as concepts, so an agent can be
#         pointed at either; what is being scored is whether it was sent
#         somewhere that answers, not whether it picked the file this set
#         happens to key on.
#   FAIL  any answer leading to `trap`, however well written.
#   FAIL  a confident answer that is wrong. Worse than an admitted gap, and
#         scored worse, because an admitted gap makes the user look.
#
# `trap` is the plausible wrong answer — usually what a model would infer from
# general knowledge of similar systems if the summary does not stop it. A
# question with no trap is not testing anything.
#
# Run it per assistant. The bar is the weakest, not the best.
#
# Some entries are statements, not questions — "I renamed a flow and now its
# schedule never fires." That is deliberate: a symptom report is how most of
# these reach an agent, and it leaves the model to connect the symptom to the
# cause. Rephrasing one as "why does renaming a flow stop its schedule?" names
# the connection the summary is meant to supply. Keep them as reports.

- q: I renamed a flow and now its schedule never fires.
  concept: flow-identity
  pass: identity is the name inside the file, so the rename deleted one flow and created another; the manifest's schedule still names the old flow, so install dropped it — point the schedule at the new name
  trap: suggests the schedule cache is stale, or to re-publish, or to check the cron expression

- q: Does the filename of a flow matter?
  concept: flow-identity
  pass: no — the name inside the file is the identity; the filename is free
  trap: says the filename must match the flow name

- q: I dropped a sample payload into the bundle and something odd installed.
  concept: app-bundle, flow-identity
  pass: every non-reserved YAML file at the bundle root installs as a flow; sample payloads belong outside the bundle directory
  trap: blames the manifest, says unrecognised files are ignored, or says to keep it in the bundle renamed to .json

- q: I published half an hour ago and the channel still runs the old version.
  concept: bundle-version, publish-and-apply
  pass: minting the version and installing it are separate; the install was blocked or skipped, so check what the channel runs and finish it with apply
  trap: says to wait for a cache, redeploy, or republish

- q: Can I fix a bad version by republishing the same version number with corrected files?
  concept: bundle-version
  pass: no — versions are immutable; the same number with different content is refused; publish forward instead
  trap: says yes, or suggests deleting the version first

- q: I want to roll back to 1.2.0. Can I publish its exact files again as 1.4.0?
  concept: bundle-version
  pass: no — content identical to an earlier version on the line is refused because its digest is taken; change something, such as the changelog, and publish forward
  trap: says yes, because the version number is new

- q: I only wanted to change one channel, but a colleague says theirs changed too.
  concept: fork-line
  pass: a publish is a line operation — every channel on the fork line converges, each on its own daily update
  trap: says that cannot happen, or blames a shared template, or suggests it was a bad apply

- q: How do I undo a fork?
  concept: fork-line
  pass: there is no unfork and no way to re-bind an earlier version; an old version can be read by id with app checkout --version and its content published forward; treat the fork as one-way
  trap: invents an unfork or a rollback command

- q: Which version should I base my edits on, the one the channel runs or the newest?
  concept: fork-line, channel-binding
  pass: the line's head is the publish base; a publish based on anything else, including the bound version when it lags, is refused
  trap: says the bound version, because that is what is live

- q: We upgraded the app while a long flow was mid-run. Did it pick up the new code?
  concept: channel-binding
  pass: no — the run pins its version at start and keeps pairing that flow with that code until it ends
  trap: says yes, or says it depends, or warns about mixed versions

- q: I removed the schedules block from the manifest and the schedules are still there.
  concept: manifest-keys
  pass: omitting a key leaves the channel alone; only an explicit empty list replaces with nothing
  trap: says removal should have deleted them, and suggests a reinstall

- q: What is the safest way to delete every schedule an app declares?
  concept: manifest-keys
  pass: "declare `schedules: []` — an empty list means replace with nothing"
  trap: says to remove the key

- q: I added a `schedule:` block to my manifest and nothing happened.
  concept: manifest-keys
  pass: unknown top-level keys are ignored without a warning; the key is `schedules`
  trap: suggests the cron expression is wrong, or that the install failed

- q: My channel lost its app type after an install and the interface changed.
  concept: manifest-keys
  pass: a manifest with no app_type strips whatever the channel had; never install an untyped bundle into a channel running a real app
  trap: blames a client bug or a failed migration

- q: I renamed a table column in the manifest and the old values are gone from the new one.
  concept: manifest-keys, merge-policy
  pass: the reconcile is additive and never renames — it added a column and orphaned the old one, data intact in the old
  trap: says the data was migrated, or offers a backfill as though the rename worked

- q: How do I record the first time we saw a row, without it changing on later updates?
  concept: merge-policy
  pass: declare the column with `merge` set to `keep` — first write wins, and later writes to it are ignored once it holds a value
  trap: says no such policy exists and hand-rolls a gated second write, or invents a mode such as first or ignore

- q: I want a column counting how many times a row has come back.
  concept: merge-policy
  pass: a number column with `merge` set to `increment_on_change` and `merge_when` naming the transition that means it came back; the write must merge
  trap: says a counter is impossible, or builds one from a concat history or a read-add-write step

- q: Can a table's merge key be a number column?
  concept: merge-policy
  pass: no — merge key columns must be indexed strings, or computed; any other type is refused when the schema is validated
  trap: says yes

- q: Can a timestamp history column be a datetime?
  concept: merge-policy
  pass: no — concat requires a string column
  trap: says yes

- q: My operator toggle keeps reverting to the default.
  concept: scalar-tiers
  pass: it is declared under scalars, so install owns it — a fresh install writes it back; use default_scalars, which writes once and only if absent
  trap: blames a race, a cache, or a client overwrite

- q: A flow writes a cursor scalar. Should I declare it in the manifest so it exists?
  concept: scalar-tiers
  pass: no — declaring it makes install its owner, so a fresh install resets it and an update overwrites it while it still equals the declared value; flows may create their own keys
  trap: says yes, declare it for clarity or to guarantee it exists

- q: Can I ship a default for the outbound send mode in my manifest?
  concept: scalar-tiers
  pass: yes, but only via default_scalars — platform keys are never declared under scalars, and the default is off
  trap: says to declare it under scalars, or that it cannot be defaulted at all

- q: Can I set a row's status directly to retained?
  concept: state-machine, actions-and-status
  pass: no — status is a projection of the machine tuple, so a direct write is overwritten; fire the event instead
  trap: says to update the status column, or to patch the record

- q: Two of my machines both have a state called done and the bundle will not install.
  concept: state-machine
  pass: the status vocabulary is the union of every machine's states, so a value must identify its own machine; rename one
  trap: suggests namespacing at read time, or calls it a validation bug

- q: Where do I configure the buttons a user sees on a row?
  concept: state-machine
  pass: on the transition — every button is an edge, so the graph and the interface cannot disagree
  trap: invents a separate buttons, actions or ctas config block

- q: My bundle publishes fine, so the state graph must be correct.
  concept: state-machine
  pass: parse-time checks prove structure — no unreachable states, no dead ends — not intent; a well-formed graph can still be wrong
  trap: agrees that publishing validates the graph's correctness

- q: "Publish fails with states: 'review': no expected edge enters ['in_review']."
  concept: states-authoring
  pass: every state but the initial needs one edge into it marked expected — the normal way in, not the likely one; add expected true (or a list of its from states) to that edge
  trap: says the state is unreachable and adds another edge, or suggests reordering states or declaring it initial

- q: Publish says my table lacks columns the states tier writes, but those are columns the transitions set.
  concept: states-authoring
  pass: the table named by states must declare every column the tier reads or writes — writes and payload_writes targets, machine columns, Status, CTAs and Why (defaults included) and predicate columns; declare them under tables
  trap: says the columns are created on first write, or to have a flow write them before publishing

- q: My button flow's then step never runs after the edge applies.
  concept: states-authoring
  pass: feature.state.transition does not start flow or then flows — it returns them as launches, and the calling flow must start each one with foundation.workflow.start_flow
  trap: blames the then when condition, or says the engine launches it asynchronously and to wait

- q: What actually happens when I run apply?
  concept: publish-and-apply
  pass: it brings that one channel to its own line's head, takes no version from the caller, and reports already-current when there is nothing to do
  trap: says it publishes, or that it can move a channel to a version you name

- q: Is there anything that stops me publishing a change that affects everyone?
  concept: publish-and-apply
  pass: no — the guards check permission and validity, none asks about reach; how many channels it reaches is reported only after the version exists
  trap: claims a confirmation, a dry run, or a staged rollout exists

- q: I published a bad version yesterday. Can I get the files from the version before it?
  concept: bundle-version, fork-line
  pass: yes — app checkout --version <id> reads an earlier version of the line read-only; to make it current, copy its files over a fresh checkout of the head and publish forward
  trap: says no version-addressed read exists, or that the old version can be re-bound or republished as-is

- q: My fork's new manifest dropped app_type. Will publish stop me?
  concept: publish-and-apply, manifest-keys
  pass: no — publish treats it as the line's app, and every install of that version clears app_type and channel_agent on each channel on the line; keep both keys
  trap: says publish refuses a manifest whose app_type differs from its line, so it is safe

- q: What is a Routine, and is it the same as a project or a channel?
  concept: product-glossary, glossary
  pass: yes — a Routine is the product's name for one piece of ongoing work Popcorn runs; the MCP tools and web app call it a project, and the API and CLI a channel
  trap: describes a Routine as a flow, a schedule, or a separate object from the project

- q: If I change a setting on one Routine, will it lose the template's future updates?
  concept: product-glossary, routine-settings, change-how-a-routine-behaves
  pass: no — a setting reaches only that Routine, can be set back and survives the template's improvements; only a change to what the Routine is built from, such as its Tables or the steps it runs, gives it a copy of its own, which stops receiving them
  trap: says every change stops updates, or that a setting reaches every Routine made from the template

- q: A person asks what triggers their Routine. What counts as a Trigger?
  concept: product-glossary, glossary
  pass: how work arrives — a schedule, a message in the Routine, a document added to it, a booking through its calendar link, or another system posting to it (in the platform, schedules, webhooks, message triggers and documents)
  trap: counts a person's Action, such as an approval, as a Trigger, or says Trigger always needs a qualifier

- q: Is a channel template something different from an app bundle?
  concept: glossary, app-bundle
  pass: no — channel template is the older name for an app and its bundle; it survives in channel templates and channel create --template, which both mean the app
  trap: describes a channel template as a separate starter layer, a Jinja template, or the bundle's templates/ directory

- q: A script I wrote refers to the channel by its name. Is that safe to keep?
  concept: glossary
  pass: no — a channel is identified by its UUID and its name can change; resolve the name once and keep the UUID (the conversation_id on the wire)
  trap: says the name is the stable identifier, or that name and UUID are interchangeable forever

- q: The API gave me a rev on the channel config. What is it for?
  concept: glossary
  pass: it is a revision token for a conditional write — send it back as If-Match on a parameters update, and a mismatch is refused with 412 stale_rev naming the current rev; it is not a version_id
  trap: treats rev as the bundle version or a semver, or says a mismatch returns 409

- q: What does a 412 mean?
  concept: glossary
  pass: a conditional write carried a stale rev — the row or channel config changed since it was read; the refusal is 412 stale_rev with the current rev, so re-read and retry with that rev
  trap: calls it a validation or permission error, says to retry unchanged, or says a stale write returns 409

# The generated reference pages. Their summaries say what each page lists, not
# the entries themselves, so a question here is usually answered in two calls:
# the summary points at the page and the entry answers. The deferral PASS above
# covers that — "read the CLI reference" is a pass when the entry answers the
# question. The grader checks a deferral against the page's body in
# chunks.json, since llms-full.txt carries a reference page by summary only.

- q: Can I install the popcorn CLI from PyPI?
  concept: cli
  pass: no — the CLI installs from its GitHub repository, not PyPI
  trap: gives a pip install command for a package on PyPI

- q: With POPCORN_AGENT=1 set, popcorn app publish refuses to run without a prompt.
  concept: cli, glossary, template-authoring
  pass: agent mode defaults --json, --quiet and --no-color but does not imply --yes, and app publish requires --yes (or POPCORN_ASSUME_YES=1) in agent mode even on a TTY
  trap: says agent mode implies --yes, or to unset POPCORN_AGENT or pipe an answer into the prompt

- q: How does my script tell an expired login apart from a server error when a popcorn command fails?
  concept: cli
  pass: run it with --json and branch on the failure envelope's error_code — unauthorized versus server_error, which is retryable — or on the exit code, 2 for auth and 4 for server; not on the legacy code field
  trap: parses the human-readable error message, or branches on the code field

- q: webhook list does not show the URL to post payloads to.
  concept: cli
  pass: pass --show-url to webhook list or webhook get; the ingest URL embeds a secret token, so it is hidden by default
  trap: says to build the URL from the webhook id, or that it cannot be read back after create

- q: Which popcorn command stops every running run of a flow?
  concept: cli
  pass: flow runs cancel --flow <name> --channel <channel>, a cooperative cancel; --force terminates on the spot
  trap: loops over the runs cancelling one id at a time, invents a flow stop or disable command, or deletes the flow

- q: A popcorn command with --json returned one page of results. How do I get the rest?
  concept: cli
  pass: data.pagination.next is a map of CLI flags to values to pass back to the same command; it is null when there are no more
  trap: invents a --page flag, or says to raise --limit until everything fits

- q: Can I publish an app through the Popcorn MCP server?
  concept: mcp
  pass: no — the hosted tools cover identity, channels, search, messages and reactions; the app tools are proposed and not built, so publish with the CLI's app publish
  trap: describes app_publish, or its preview and confirm, as a tool that exists today

- q: How do I reply in a thread with the MCP tools?
  concept: mcp
  pass: post_message with message_id set to the message whose thread it replies in, in place of conversation_id
  trap: invents a reply tool, or a thread_id argument on post_message

- q: The MCP search tool keeps returning channels from the wrong workspace.
  concept: mcp
  pass: every call runs in the workspace whoami last selected; call whoami with workspace_id to switch, or with none to list the workspaces available
  trap: says to reconnect or re-authenticate the server, or to pass a workspace to search

- q: The MCP search tool fails when I search messages without any text.
  concept: mcp
  pass: query is required when type is messages; it is optional only when listing channels, dms or users
  trap: blames permissions, or an empty message history

- q: What arguments does foundation.store.upsert_rows take?
  concept: activities
  pass: conversation_id and table_name, and exactly one of rows or rows_file_key; merge_on updates a match instead of duplicating it, on_conflict is replace by default or merge to keep omitted columns, and change_kind and change_action name the write in the audit log
  trap: invents arguments such as table or records, or says rows and rows_file_key may both be given

- q: How do I make a flow step act as one specific connected account?
  concept: activities
  pass: every activity accepts integration_id, normally $channel.integrations.<name>.id, or integration_name to resolve a named channel integration instead
  trap: invents a credentials or account argument, or says the account can only be set for the whole channel

- q: popcorn flow activities lists an activity the activity reference does not. Is the reference out of date?
  concept: activities
  pass: not necessarily — the reference lists only foundation and feature activities at release or beta; alpha, deprecated and app-specific ones appear only in popcorn flow activities, and --name <wire.name> prints one's arguments
  trap: says the reference is stale and needs regenerating, or that the activity was removed

- q: Why did my schedule disappear after I published a new version of the bundle?
  concept: schedules, flow-identity
  pass: install reconciles schedules by (flow, slug); a schedule whose flow is not in the bundle — a typo or a renamed flow — is skipped and then deleted as undeclared
  trap: says schedules are never deleted by install, or blames the daily update

- q: Which string formats can a table column declare, and is display checked?
  concept: table-columns
  pass: string takes uuid, email, url, phone, ipv4, ipv6, hex_color or slug, checked on every write; display is checked only for its kind, so a misspelled argument silently does not render
  trap: says any format works on any type, or that display arguments are validated

- q: Can a block's outer step read the steps nested inside it?
  concept: flow-grammar
  pass: no — a block's inner steps are private; outside it only the block's declared outputs are readable, as $steps.<block>.output.<name>
  trap: says $steps.<inner>.output is readable from outside the block

- q: How do I subtract a number of minutes from a reference?
  concept: references
  pass: nothing in a reference computes — -$x is a literal string; use foundation.math.calculate, or foundation.math.offset with direction subtract for timestamps
  trap: writes $a - $b or -$channel.minutes inline

- q: Adding && to my when expression changed how the first comparison behaves.
  concept: conditions
  pass: a lone == is lenient legacy equality, but with && the string routes to the strict, typed expression rail, so the comparison becomes typed
  trap: says && and == always compare the same way

- q: How many times does a step run when it has no on_error?
  concept: on-error
  pass: up to 4 attempts; a non-idempotent step must set retry 0
  trap: says once, or that retries are off by default

- q: My webhook payload has no severity field; should I use fields.extract or agent.transform?
  concept: extract-or-derive
  pass: extract what the payload states; a field it does not state has to be derived with agent.transform, guarded by a recognized flag because the model invents an object given junk
  trap: uses fields.extract with a default for severity, or trusts the output schema to reject junk

- q: Why does my customized Routine no longer get the template's improvements?
  concept: product-glossary, fork-line, customizing-a-routine
  pass: a change to what the Routine is built from gave it a copy of its own (a fork line), and a fork line no longer receives product releases; forking cannot be undone
  trap: says the improvements are paused and can be resumed, or to re-install the product template

- q: Where do a Routine's settings like its send mode come from?
  concept: scalar-tiers
  pass: many Routine Settings are scalars; popcorn.* switches such as popcorn.email_send_mode belong in default_scalars so a member's change survives updates
  trap: declares the send mode under scalars:, which install then owns

- q: How does a Routine decide which Actions an item offers?
  concept: product-glossary, state-machine, states-authoring
  pass: the template declares state machines; each Action is the button on a staff edge, offered when the edge is legal from where the item stands
  trap: says Actions are configured separately from Status

- q: Is #claims-west on the latest version of its template, and is it finished installing?
  concept: routines
  pass: get_routine shows Version (and whether it is the latest), Install (whether the latest install landed) and Updates from; wait_seconds waits up to 20 for an install in progress
  trap: says there is no way to tell, or reads the template list instead of the Routine

- q: Which changes to a Routine stay with it, and which give it a copy of its own?
  concept: customizing-a-routine
  pass: Routine Settings, Connections, Instructions, References and, where the template allows, its steps stay with the Routine and survive template improvements; a change to what it is built from (a new Table, a kind of step the template does not offer) gives it a copy of its own, which stops receiving improvements and cannot be undone
  trap: says every change stops the template's improvements, or that a copy can be reverted

- q: If I add a review before the agreement goes out, does my Routine stop getting the template's improvements?
  concept: customizing-a-routine, reviews
  pass: no, where the template keeps its steps with the Routine; changing, adding or reordering steps stays with that Routine, an earlier version or the template's own can be put back, and only a kind of step the template does not offer needs a copy of its own
  trap: says any change to the steps gives the Routine a copy of its own, or that it cannot be undone

- q: Can my assistant run our Routine's morning schedule right now without waiting?
  concept: triggers
  pass: run_trigger runs a schedule now with its usual inputs after a dry run and confirm=true; the next scheduled run still happens; only schedules can be run this way
  trap: says to change the schedule's time, or that a message or webhook Trigger can be run the same way

- q: The Routine says an account is missing. Can my assistant connect our Gmail for it?
  concept: connections
  pass: no — a Connection signs in as a person, so that person connects it in the Routine's settings in Popcorn; get_routine shows which are NOT CONNECTED
  trap: tries to connect the account through a tool, or asks for the password

- q: Where does a Routine get the policy document it checks claims against?
  concept: reference-documents
  pass: it is a Reference, added by a person in Popcorn; some documents start work when added, which list_triggers shows; no assistant tool adds or reads one yet
  trap: puts the policy in a Table as a row, or claims a tool can upload it

- q: How do I make one Routine wait three days between reminders instead of seven?
  concept: routine-settings, change-how-a-routine-behaves
  pass: find the reminder interval with list_routine_settings, then update_routine_setting after a dry run; it reaches that Routine only and survives template improvements
  trap: proposes giving the Routine a copy of its own, or changing every Routine made from the template

- q: I want the Routine's agent to always ask me before emailing the carrier. Where does that go?
  concept: instructions
  pass: that is the Routine's Instructions; a person tells the Routine's agent in Popcorn, or an assistant changes the Routine's Steps with change_routine after showing the proposal; wording that is a Routine Setting is changed with update_routine_setting; get_instructions shows what is there now
  trap: says to change a Routine Setting that does not exist, or to edit the template

- q: How do I find every claim in #intake that is still open?
  concept: tables, work-a-routines-items
  pass: list_rows with filter {"Status": "open"} on the claims Table; query finds text in any column; there is no per-Status count yet
  trap: reads every row and filters by hand, or uses a count tool that does not exist

- q: Can my assistant mark an item approved by writing its Status?
  concept: actions-and-status
  pass: no — Status is worked out from what happened and create_rows/update_row refuse it; take the Approve Action with take_action after a dry run and confirm with its run_key
  trap: writes the Status column directly

- q: Did the Routine's reminder emails go out yesterday? Can my assistant check?
  concept: history
  pass: that is the Routine's History; list_history shows an item's email turns and the runs that changed it, one item at a time and back as far as Popcorn keeps it; the conversation and email bodies are read in Popcorn
  trap: claims an assistant tool reads the Routine's messages, or a timeline of the whole Routine at once

- q: Walk me through starting a new Routine from the claims template.
  concept: set-up-a-routine
  pass: list_routine_templates, create_routine dry run then confirm, wait for Install with get_routine, have the account owner make each Connection in Popcorn, then list_triggers
  trap: skips the Connections step, or creates the Routine without showing the dry run

- q: My assistant should close a claim the way pressing its Close button would. How does it do that?
  concept: work-a-routines-items, actions-and-status
  pass: list_actions on the row, take_action close as a dry run, then confirm=true with its run_key; get_row shows the new Status
  trap: sets the Status column with update_row

- q: What happens if a client doesn't reply to the Routine's emails?
  concept: steps
  pass: the Step follows up on the Routine's reminder schedule within its sending hours; when the follow-ups run out the item closes with a reason such as No response, and a later reply reopens the Step
  trap: says Popcorn keeps emailing indefinitely, or that a closed item cannot come back

- q: How do I make Popcorn wait for me before it sends the retainer?
  concept: reviews, steps
  pass: add a Review before the signing Step by telling the Routine's agent in Popcorn; the item then waits, says why, and offers choices such as Send retainer, Already signed or Do not send retainer
  trap: says to change a Routine Setting with update_routine_setting, or that an assistant can add the Review through MCP

- q: How do I connect Claude to my Popcorn workspace?
  concept: connect-your-assistant
  pass: add the MCP server at https://mcp.popcorn.ai/mcp, sign in to Popcorn and choose the workspace on the consent page, then check with get_workspace; the connection is bound to that one workspace
  trap: says to paste an API key, or that the assistant can switch workspaces without reconnecting

- q: Can Popcorn write the emails for me to check instead of sending them?
  concept: routine-settings
  pass: yes, set the Email sending setting to Draft with update_routine_setting after a dry run; each email is written for a person to send, and Off sends nothing
  trap: says this needs a copy of the template, or a change to the Routine's Instructions

- q: Which clients in #intake are waiting at the retainer Review?
  concept: work-a-routines-items, reviews
  pass: list_rows on the Routine's Table filtered on the Status value of that Review, such as retainer_review (shown in Popcorn as Needs retainer review); list_actions then shows Send retainer, Already signed and Do not send retainer
  trap: says to filter on the label text, or that take_action can send the retainer itself

- q: How many items in #intake are waiting for a person, and why?
  concept: reviews, work-a-routines-items
  pass: get_status counts the items at each Status, marks the ones that need a person, and lists what is waiting with its reason and the items it is about
  trap: says to page through list_rows and count by hand, or that no tool can tell

- q: Can my assistant see what a Routine's Steps are?
  concept: steps
  pass: yes, get_routine lists the Steps in order with each Review's choices and where they lead, and which choices are made only in Popcorn; change_routine changes them from a description, after the person reads the proposal
  trap: says no tool reads the Steps, or that an assistant changes them without showing the proposal first

- q: What happened with Ben Garrett's intake, and who sent the retainer?
  concept: history
  pass: list_history with the item's row ID lists each change newest first, with who or what made it (a member by name, or Popcorn for the work it was doing), the Status moves, and the runs that changed it
  trap: says to read get_row's last-changed time, or that no tool shows an item's history

- q: How do I add a question to the intake Step from my assistant?
  concept: steps, change-how-a-routine-behaves
  pass: change_routine with the request starts a draft; get_routine_change shows the Steps before and after once it is proposed; confirm with the change_id and confirm=true; revert_to puts the version before back
  trap: says to edit the Routine's settings or the template's files, or that the change installs without a proposal

- q: What instructions is #intake working from?
  concept: instructions
  pass: get_instructions lists the Routine's Instructions by part, with where each came from and what changes it
  trap: says to read the template's AGENT.md only, or that no tool shows them

- q: Why hasn't my intake Routine booked any inspections? Is something not connected?
  concept: connections
  pass: list_connections lists each Connection the Routine needs as made or NOT MADE, whose account it uses, and what stops without it; a person makes a missing one in Popcorn, in the browser
  trap: says an assistant can connect the account itself, or that no tool shows what stops without a Connection

- q: Which documents is my claims Routine still waiting for, and can my assistant read the questions it sends?
  concept: reference-documents
  pass: list_references lists each Reference as added (when and by whom) or still waiting; read_reference returns a text one's text, or a download link for any other file
  trap: says no tool lists or reads a Routine's References

- q: Show me one change to an item in full, with what the run that made it did.
  concept: history
  pass: read_history_entry with an entry_id from list_history shows every field the change touched, before and after, and the run that made it, step by step
  trap: says get_row shows the earlier values, or that only the one-line summary is available

- q: Can my assistant replace the fee schedule document on my Routine?
  concept: reference-documents
  pass: add_reference adds or replaces it from text or an uploaded file, as a dry run first and then confirm=true; a Reference picked from Google Drive, or the Routine's Steps, stays in Popcorn or change_routine, and list_references marks which
  trap: says no tool adds a Reference, or that add_reference can replace the Routine's Steps
